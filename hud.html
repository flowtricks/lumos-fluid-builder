<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumos Fluid Builder controls</title>
    <link rel="stylesheet" href="hud.css" />
  </head>
  <body>
    <div class="card" id="card" data-loading>
      <header>
        <button class="compare" id="compare" type="button" aria-pressed="false" aria-label="Compare with the other levels" title="Compare with the other levels">
          <svg viewBox="0 0 16 12" aria-hidden="true"><path d="M1 10.5 15 8.5M1 8 15 4.5M1 5.5 15 1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <span class="chip" id="chip">—</span>
        <span class="flag" id="flag" data-off>
          <span class="badge" id="badge" tabindex="0" role="img"></span>
          <span class="tip" id="tip" role="tooltip"><span id="tip-msg"></span> <a id="tip-why" target="_blank" rel="noreferrer" hidden>Read why</a></span>
        </span>
        <span class="now" title="Font size at the canvas's current width"><b id="now">—</b><span>px</span></span>
      </header>

      <div class="plot">
      <svg class="graph" id="graph" viewBox="0 0 276 34" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color: var(--tint); stop-opacity: .35" />
            <stop offset="1" style="stop-color: var(--tint); stop-opacity: 0" />
          </linearGradient>
        </defs>
        <path id="area" fill="url(#fill)" />
        <g id="ghosts" aria-hidden="true"></g>
        <path id="line" class="line" />
        <circle id="dot-min" class="dot" r="3.5" />
        <circle id="dot-max" class="dot" r="3.5" />
      </svg>
      <div class="playhead" id="playhead" role="slider" tabindex="0" aria-label="Canvas width in pixels" aria-orientation="horizontal" title="Drag to resize the canvas"><svg class="grip" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.4 0h9.2A1.4 1.4 0 0 1 12 1.4V5.2L6.9 11.5a1.1 1.1 0 0 1-1.8 0L0 5.2V1.4A1.4 1.4 0 0 1 1.4 0z"/></svg></div>
      <footer id="status"></footer>
      </div>

      <div class="rows">
      <div class="row" data-k="min">
      <div class="field" role="slider" tabindex="0" aria-label="Minimum font size" aria-valuemin="0" aria-orientation="horizontal" data-k="min">
        <div class="fill"></div>
        <div class="txt light" aria-hidden="true"><span class="lbl">Min<svg class="lockmark" viewBox="0 0 10 12" aria-hidden="true"><rect x="1" y="5" width="8" height="6.5" rx="1.4" fill="currentColor"/><path d="M3 5V3.6a2 2 0 0 1 4 0V5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span><span class="val"><b class="v">0</b><i>px</i></span></div>
        <div class="txt dark" aria-hidden="true"><span class="lbl">Min<svg class="lockmark" viewBox="0 0 10 12" aria-hidden="true"><rect x="1" y="5" width="8" height="6.5" rx="1.4" fill="currentColor"/><path d="M3 5V3.6a2 2 0 0 1 4 0V5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span><span class="val"><b class="v">0</b><i>px</i></span></div>
      </div>
      </div>

      <div class="row" data-k="max">
      <div class="field" role="slider" tabindex="0" aria-label="Maximum font size" aria-valuemin="0" aria-orientation="horizontal" data-k="max">
        <div class="fill"></div>
        <div class="txt light" aria-hidden="true"><span class="lbl">Max<svg class="lockmark" viewBox="0 0 10 12" aria-hidden="true"><rect x="1" y="5" width="8" height="6.5" rx="1.4" fill="currentColor"/><path d="M3 5V3.6a2 2 0 0 1 4 0V5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span><span class="val"><b class="v">0</b><i>px</i></span></div>
        <div class="txt dark" aria-hidden="true"><span class="lbl">Max<svg class="lockmark" viewBox="0 0 10 12" aria-hidden="true"><rect x="1" y="5" width="8" height="6.5" rx="1.4" fill="currentColor"/><path d="M3 5V3.6a2 2 0 0 1 4 0V5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span><span class="val"><b class="v">0</b><i>px</i></span></div>
      </div>
      </div>
      </div>

      <div class="tied-tip" id="tied-tip" role="tooltip" hidden>Unlock scale ratio or adjust the smallest level's size</div>
    </div>
    <script src="shared.js"></script>
    <script src="badge.js"></script>
    <script src="hud.js"></script>
  </body>
</html>
