<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumos Fluid Builder</title>
    <link rel="stylesheet" href="__stacki/ui.css" />
    <link rel="stylesheet" href="app.css" />
    <script src="stacki-sdk.js"></script>
    <script src="__stacki/ui.js"></script>
  </head>
  <body class="stacki-ui">
    <section class="block controls">
      <div id="selected"></div>
      <div id="card-holder">
        <iframe id="card" class="card-frame" src="hud.html" title="Font size controls"></iframe>
      </div>
    </section>

    <section class="block">
      <div class="list-head">
        <div class="mode-head">
          <button class="mode-menu" id="mode-menu" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="mode-title">Type scale</span>
            <svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul class="mode-list" id="mode-list" role="listbox" hidden>
          </ul>
        </div>
        <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings" aria-haspopup="dialog" title="Settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M6.6 1.8h2.8l.4 1.7 1.2.7 1.7-.5 1.4 2.4-1.3 1.2v1.4l1.3 1.2-1.4 2.4-1.7-.5-1.2.7-.4 1.7H6.6l-.4-1.7-1.2-.7-1.7.5-1.4-2.4L3.2 9V7.6L1.9 6.4l1.4-2.4 1.7.5 1.2-.7z"/><circle cx="8" cy="8.3" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
      <ul class="scale" id="scale"></ul>
    </section>

    <section class="block scale-section" id="scale-section" hidden>
      <div class="scale-fields">
        <div class="scale-field" data-side="min">
          <div class="scale-head">
            <label class="scale-label" for="scale-min">Min scale ratio</label>
            <button class="scale-lock" type="button" data-side="min" aria-pressed="true" hidden>
              <svg class="lock-closed" viewBox="0 0 12 14" aria-hidden="true"><rect x="1.5" y="6" width="9" height="7" rx="1.6" fill="currentColor"/><path d="M3.8 6V4.3a2.2 2.2 0 0 1 4.4 0V6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <svg class="lock-open" viewBox="0 0 12 14" aria-hidden="true"><rect x="1.5" y="6" width="9" height="7" rx="1.6" fill="currentColor"/><path d="M3.8 6V4.3a2.2 2.2 0 0 1 4.2-.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="scale-box">
            <input id="scale-min" aria-label="Minimum type scale" class="scale-input" inputmode="decimal" placeholder="-" autocomplete="off" spellcheck="false" />
            <button class="scale-menu" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose a minimum type scale"><svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <ul class="scale-list" role="listbox" hidden></ul>
          </div>
        </div>
        <div class="scale-field" data-side="max">
          <div class="scale-head">
            <label class="scale-label" for="scale-max">Max scale ratio</label>
            <button class="scale-lock" type="button" data-side="max" aria-pressed="true" hidden>
              <svg class="lock-closed" viewBox="0 0 12 14" aria-hidden="true"><rect x="1.5" y="6" width="9" height="7" rx="1.6" fill="currentColor"/><path d="M3.8 6V4.3a2.2 2.2 0 0 1 4.4 0V6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <svg class="lock-open" viewBox="0 0 12 14" aria-hidden="true"><rect x="1.5" y="6" width="9" height="7" rx="1.6" fill="currentColor"/><path d="M3.8 6V4.3a2.2 2.2 0 0 1 4.2-.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="scale-box">
            <input id="scale-max" aria-label="Maximum type scale" class="scale-input" inputmode="decimal" placeholder="-" autocomplete="off" spellcheck="false" />
            <button class="scale-menu" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose a maximum type scale"><svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <ul class="scale-list" role="listbox" hidden></ul>
          </div>
        </div>
      </div>
    </section>

    <p id="status" class="status" role="status" hidden></p>

    <div class="modal" id="settings" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <header class="modal-head">
          <h2 id="settings-title">Settings</h2>
          <button class="text-btn primary" id="settings-done" type="button">Done</button>
        </header>
        <div class="modal-body" id="settings-body"></div>
        <footer class="modal-foot">
          <button class="text-btn" id="cfg-newgroup" type="button">+ Add group</button>
        </footer>
      </div>
    </div>

    <script src="shared.js"></script>
    <script src="badge.js"></script>
    <script src="trace.js"></script>
    <script src="scale.js"></script>
    <script src="app.js"></script>
  </body>
</html>
